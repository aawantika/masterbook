services:
  masterbook:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
    volumes:
      # data/ and epub-sources/ are the app's entire durable state -- moving
      # to different hardware is copying these two folders and running the
      # same compose file there.
      - ./data:/app/data
      - ./epub-sources:/app/epub-sources
      # Never baked into the image or committed -- downloaded once from the
      # Firebase Console, mounted read-only.
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  # Tunnel container for outbound-only public access (no inbound ports on
  # the host network). Configure the public hostname/routing in your
  # tunnel provider's own dashboard -- deliberately not documented here.
  # TUNNEL_TOKEN comes from a gitignored .env file next to this compose
  # file; without it this container just restart-loops, so for a purely
  # local run use `docker compose up -d masterbook` instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - masterbook
