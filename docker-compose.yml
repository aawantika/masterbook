services:
  masterbook:
    build: .
    restart: unless-stopped
    ports:
      # Host loopback only -- reachable from this Mac (for local use and
      # debugging) but not from other machines on the LAN. Remote access
      # goes through the cloudflared service below, which reaches the app
      # over the internal Docker network, not this published port.
      - '127.0.0.1:3001:3001'
    environment:
      - PORT=3001
      # 0.0.0.0, not 127.0.0.1 -- inside the container's own network
      # namespace, binding to loopback only would make the app unreachable
      # via Docker's port mapping from the host (and, later, from the
      # Cloudflare Tunnel pointed at that host port). Local (non-Docker)
      # dev is unaffected -- this env var is only set here, in compose.
      - HOST=0.0.0.0
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
    volumes:
      # The literal portability unit (see the plan) -- these two host
      # directories are the entire durable state of the app. Moving to
      # different hardware later is copying these two folders and
      # starting the same compose file there.
      - ./data:/app/data
      - ./epub-sources:/app/epub-sources
      # Never baked into the image or committed -- downloaded once from
      # the Firebase Console, lives only on this host's disk, mounted
      # read-only into the container at the path GOOGLE_APPLICATION_CREDENTIALS
      # points at above.
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  # Cloudflare Tunnel -- an outbound-only connection from this host to
  # Cloudflare, so no router port-forwarding and no public IP exposure.
  # The tunnel's public hostname is configured in the Cloudflare Zero Trust
  # dashboard to point at http://masterbook:3001 (the service name above).
  # TUNNEL_TOKEN comes from a gitignored .env file next to this compose
  # file -- without it this container just restart-loops, so for a purely
  # local run use `docker compose up -d masterbook` instead.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - masterbook
